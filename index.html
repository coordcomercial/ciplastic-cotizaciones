<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--nv:#1a3a6b;--nv2:#12294d;--tl:#2bbfd4;--tl2:#1a8fa0;--gr:#e8edf4;--gr2:#f4f7fb;--tx:#2d3748;--lt:#718096;}
body{font-family:Arial,'Helvetica Neue',sans-serif;background:var(--gr);color:var(--tx);font-size:13px;}
.wrap{max-width:980px;margin:0 auto;padding:16px;}
.appbar{background:linear-gradient(135deg,var(--nv),#2a4d9a);color:#fff;padding:13px 20px;border-radius:10px;margin-bottom:16px;display:flex;align-items:center;gap:14px;box-shadow:0 4px 18px rgba(26,58,107,.28);}
.appbar img{height:44px;filter:brightness(0)invert(1);}
.appbar h1{font-size:16px;font-weight:700;}
.appbar p{font-size:10px;opacity:.6;margin-top:1px;}
.lang-sw{display:flex;gap:6px;margin-left:auto;}
.lbtn{padding:5px 14px;border-radius:20px;border:1.5px solid rgba(255,255,255,.4);background:transparent;color:rgba(255,255,255,.7);font-size:11px;font-weight:700;cursor:pointer;transition:all .15s;}
.lbtn.active{background:rgba(255,255,255,.2);color:#fff;border-color:#fff;}
.tabs{display:flex;background:#fff;border-radius:8px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.07);overflow:hidden;}
.tab{flex:1;padding:11px;text-align:center;cursor:pointer;font-size:11px;font-weight:700;color:var(--lt);border-bottom:3px solid transparent;transition:all .2s;}
.tab.active{color:var(--nv);border-bottom-color:var(--tl);}
.tab:hover:not(.active){color:var(--nv);background:var(--gr2);}
.tc{display:none;}.tc.active{display:block;}
.card{background:#fff;border-radius:10px;padding:18px;margin-bottom:13px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.ctitle{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--tl);margin-bottom:13px;padding-bottom:7px;border-bottom:1px solid var(--gr);}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
.frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px;}
.fg{display:flex;flex-direction:column;gap:4px;margin-bottom:9px;}
.fg label{font-size:10px;font-weight:800;color:var(--lt);text-transform:uppercase;letter-spacing:.5px;}
.fg input,.fg select,.fg textarea{border:1.5px solid var(--gr);border-radius:6px;padding:7px 10px;font-size:12px;color:var(--tx);font-family:inherit;transition:border-color .2s;}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--tl);box-shadow:0 0 0 3px rgba(43,191,212,.1);}
.fg textarea{resize:vertical;min-height:52px;}
.oc{border:1.5px solid var(--gr);border-radius:8px;padding:15px;margin-bottom:11px;}
.onr{display:inline-block;background:var(--nv);color:#fff;font-size:10px;font-weight:800;padding:2px 9px;border-radius:4px;margin-bottom:10px;}
.tgl{display:flex;background:var(--gr2);border-radius:6px;padding:3px;margin-bottom:12px;width:fit-content;}
.tbtn{padding:5px 13px;border-radius:4px;border:none;cursor:pointer;font-size:11px;font-weight:700;background:transparent;color:var(--lt);transition:all .15s;}
.tbtn.active{background:#fff;color:var(--nv);box-shadow:0 1px 4px rgba(0,0,0,.13);}
.pbadge{background:linear-gradient(135deg,var(--nv),#2a4d9a);color:#fff;border-radius:8px;padding:12px;}
.pbadge-prices{margin-top:8px;display:flex;align-items:baseline;gap:10px;}
.pbadge-before{font-size:11px;text-decoration:line-through;opacity:.5;}
.pbadge-now{font-size:20px;font-weight:700;color:#7dd8e8;}
.pbadge-valid{font-size:10px;opacity:.6;margin-top:2px;}
.pbadge-bonos{margin-top:6px;display:flex;gap:5px;flex-wrap:wrap;}
.bono-pill{background:rgba(43,191,212,.25);color:#7dd8e8;border-radius:10px;padding:2px 8px;font-size:10px;font-weight:700;}
.calcbox{background:var(--gr2);border:1px solid var(--gr);border-radius:6px;padding:7px 11px;margin-top:7px;font-size:12px;color:var(--lt);}
.calcbox strong{color:var(--nv);font-size:14px;}
.er{display:flex;align-items:flex-start;padding:9px 0 5px;border-bottom:1px solid var(--gr);gap:9px;}
.er-wrap{border-bottom:1px solid var(--gr);margin-bottom:2px;}
.er-wrap:last-child{border-bottom:none;}
.er-wrap .er{border-bottom:none;margin-bottom:0;}
.einfo{flex:1;}
.ename{font-size:12px;font-weight:700;}
.edesc{font-size:10px;color:var(--lt);margin-top:2px;}
.epright{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;}
.eprice{font-size:11px;font-weight:800;color:var(--tl);}
.spt{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--lt);cursor:pointer;}
.spt input{accent-color:var(--nv);width:12px;height:12px;}
.rec-opts{background:var(--gr2);border-radius:6px;padding:10px 12px;margin:4px 0 8px 26px;display:none;}
.rec-opts.show{display:block;}
.rec-chk{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--nv);cursor:pointer;margin-top:6px;}
.rec-chk input{accent-color:var(--nv);width:14px;height:14px;}
.rec-price-tag{display:inline-block;background:var(--nv);color:#fff;border-radius:5px;padding:3px 10px;font-size:12px;font-weight:700;margin-top:7px;}
.btn{padding:7px 14px;border-radius:6px;border:none;cursor:pointer;font-weight:700;font-size:11px;transition:all .15s;}
.btn-nv{background:var(--nv);color:#fff;}.btn-nv:hover{background:var(--nv2);}
.btn-tl{background:var(--tl);color:#fff;}.btn-tl:hover{background:var(--tl2);}
.btn-out{background:transparent;border:1.5px solid var(--gr);color:var(--tx);}.btn-out:hover{border-color:var(--nv);color:var(--nv);}
.btn-del{background:#fff0f0;color:#c53030;border:1px solid #fecaca;}.btn-del:hover{background:#fecaca;}
.btn-sm{padding:4px 8px;font-size:10px;}
.btn-lg{width:100%;padding:13px;font-size:13px;border-radius:8px;letter-spacing:.2px;}
.addbtn{width:100%;padding:11px;border:2px dashed var(--gr);border-radius:8px;background:transparent;color:var(--lt);cursor:pointer;font-size:11px;font-weight:700;transition:all .2s;margin-bottom:13px;}
.addbtn:hover{border-color:var(--tl);color:var(--tl);}
.totalcard{background:linear-gradient(135deg,var(--nv),#2a4d9a);color:#fff;border-radius:10px;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;margin-top:5px;}
.tlabel{font-size:11px;opacity:.75;}
.tamount{font-size:25px;font-weight:700;}
.pmcard{border:1.5px solid var(--gr);border-radius:8px;padding:13px;margin-bottom:10px;}
.pmname{font-weight:700;font-size:13px;color:var(--nv);}
.pmsub{font-size:11px;color:var(--lt);margin-top:2px;}
.toast{position:fixed;bottom:18px;right:18px;color:#fff;padding:10px 16px;border-radius:8px;font-size:12px;font-weight:700;box-shadow:0 4px 12px rgba(0,0,0,.2);z-index:999;display:none;}
.info-box{background:#e8f4fd;border:1.5px solid #90cdf4;border-radius:8px;padding:12px 14px;margin-top:13px;font-size:11px;color:#2b6cb0;line-height:1.6;}
.tag-mayo{display:inline-block;background:linear-gradient(135deg,var(--tl),var(--nv));color:#fff;border-radius:10px;padding:1px 7px;font-size:9px;font-weight:800;margin-left:6px;vertical-align:middle;}
</style>

</div>
</div>

function initExtras(){
  const prev=extras; // preserve sel/sp/nights/companion
  extras=T[lang].extrasBase.map((e,i)=>{
    const old=prev[i]||{};
    return {...e, sel:old.sel||false, sp:old.sp!==undefined?old.sp:true,
      nights:e.id==='rec'?(old.nights||1):undefined,
      companion:e.id==='rec'?(old.companion||false):undefined};
  });
}

function recPrice(e){
  const n=e.nights||1, base=n*200, comp=e.companion?n*60:0;
  const l=lang==='es';
  return `$${base} USD${comp?` + $${comp} USD ${l?'acompañante':'companion'}`:''}`;
}

async function init(){
  document.getElementById('pdate').value=new Date().toISOString().split('T')[0];
  try{const r=await window.storage.get('cp_promos');if(r?.value)promos=JSON.parse(r.value);}catch(e){}
  initExtras(); applyLang(); addOp(); renderExtras(); renderPromos(); calc();
}

function applyLang(){
  document.querySelectorAll('.lbtn').forEach((b,i)=>b.classList.toggle('active',['es','en'][i]===lang));
  const ids={at:'appTitle','tt-cot':'tabCot','tt-pro':'tabPro','lbl-patient-sec':'secPatient',
    'lbl-opts-sec':'secOpts','lbl-ex-sec':'secEx','lbl-notes-sec':'secNotes',
    'lbl-pname':'lblName','lbl-pdate':'lblDate','lbl-notes':'lblNotes',
    'btn-addop':'btnAddOp','lbl-total':'lblTotal','lbl-total-sub':'lblTotalSub',
    'btn-create':'btnCreate','lbl-promos-sec':'secPromos','btn-newpromo':'btnNewPromo'};
  Object.entries(ids).forEach(([id,key])=>{const el=document.getElementById(id);if(el)el.textContent=t(key);});
  document.getElementById('pname').placeholder=lang==='es'?'Ej. ROSA PÉREZ':'E.g. ROSE SMITH';
  initExtras(); renderExtras(); ops.forEach(o=>renderOp(o)); renderPromos();
}

function setLang(l){lang=l;applyLang();calc();}
function sw(tab){
  ['cot','pro'].forEach(n=>{
    document.getElementById('tab-'+n).classList.toggle('active',n===tab);
    document.getElementById('tc-'+n).classList.toggle('active',n===tab);
  });
}

/* === OPS === */
function addOp(){
  oc++;
  ops.push({id:oc,type:'promo',pid:promos[0]?.id||'',name:'',real:'',disc:'',desc:''});
  renderOp(ops[ops.length-1]); calc();
}
function rmOp(id){ops=ops.filter(o=>o.id!==id);document.querySelector(`[data-oid="${id}"]`)?.remove();calc();}

function renderOp(op){
  const cont=document.getElementById('ocont');
  let el=cont.querySelector(`[data-oid="${op.id}"]`);
  const d=document.createElement('div'); d.className='oc'; d.dataset.oid=op.id;
  const idx=ops.findIndex(o=>o.id===op.id)+1;
  const optHtml=promos.map(p=>`<option value="${p.id}"${op.pid===p.id?' selected':''}>${p.name} — ${p.sub[lang]||''}</option>`).join('');
  const sp=promos.find(p=>p.id===op.pid);
  const rp=parseFloat(op.real)||0, dsc=parseFloat(op.disc)||0, dp=rp*(1-dsc/100);
  d.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <span class="onr">${t('option')} ${idx}</span>
      ${ops.length>1?`<button class="btn btn-del btn-sm" onclick="rmOp(${op.id})">${t('remove')}</button>`:''}
    </div>
    <div class="tgl">
      <button class="tbtn${op.type==='promo'?' active':''}" onclick="setType(${op.id},'promo')">🏷️ ${t('promo')}</button>
      <button class="tbtn${op.type==='manual'?' active':''}" onclick="setType(${op.id},'manual')">✏️ ${t('manual')}</button>
    </div>
    ${op.type==='promo'?`
      <div class="fg"><label>${t('lblSelPromo')}</label><select onchange="setPid(${op.id},this.value)">${optHtml}</select></div>
      ${sp?`<div class="pbadge">
        <div style="font-size:14px;font-weight:700;color:#fff">${sp.name} <span style="font-size:11px;opacity:.7">${sp.sub[lang]}</span></div>
        <div class="pbadge-prices"><span class="pbadge-before">$${sp.before.toLocaleString()} USD</span><span class="pbadge-now">$${sp.promo.toLocaleString()} USD</span></div>
        <div class="pbadge-valid">${t('dValid')}: ${sp.valid}</div>
        ${sp.bonos[lang]?.length?`<div class="pbadge-bonos">${sp.bonos[lang].map(b=>`<span class="bono-pill">✓ ${b}</span>`).join('')}</div>`:''}
      </div>`:''}
    `:`
      <div class="fg"><label>${t('lblProc')}</label><input value="${op.name}" oninput="setF(${op.id},'name',this.value)"></div>
      <div class="frow">
        <div class="fg"><label>${t('lblReal')}</label><input type="number" value="${op.real}" placeholder="0" oninput="setF(${op.id},'real',this.value);renderOp(ops.find(o=>o.id==${op.id}));calc()"></div>
        <div class="fg"><label>${t('lblDisc')}</label><input type="number" value="${op.disc}" placeholder="0" min="0" max="100" oninput="setF(${op.id},'disc',this.value);renderOp(ops.find(o=>o.id==${op.id}));calc()"></div>
      </div>
      ${rp>0?`<div class="calcbox">${dsc>0?`${t('dBefore')}: <s style="color:#aaa">$${rp.toLocaleString()}</s> → `:''}<strong>$${dp.toLocaleString('es-MX',{maximumFractionDigits:0})} USD</strong>${dsc>0?` <span style="color:#aaa;font-size:10px">(-${dsc}%)</span>`:''}</div>`:''}
      <div class="fg" style="margin-top:8px"><label>${t('lblProcInc')}</label>
        <textarea rows="2" oninput="setF(${op.id},'desc',this.value)">${op.desc}</textarea>
      </div>
    `}`;
  if(el)el.replaceWith(d); else cont.appendChild(d);
}
function setType(id,tp){const o=ops.find(x=>x.id===id);if(o){o.type=tp;renderOp(o);calc();}}
function setPid(id,v){const o=ops.find(x=>x.id===id);if(o){o.pid=v;renderOp(o);calc();}}
function setF(id,f,v){const o=ops.find(x=>x.id===id);if(o)o[f]=v;}

/* === EXTRAS === */
function renderExtras(){
  const cont=document.getElementById('excont');
  cont.innerHTML=extras.map(e=>{
    if(e.id==='rec'){
      const n=e.nights||1, comp=e.companion||false;
      const base=n*200, compAmt=comp?n*60:0, total=base+compAmt;
      return `<div class="er-wrap">
        <div class="er">
          <input type="checkbox" id="ex_rec"${e.sel?' checked':''} onchange="togEx('rec',this.checked)">
          <div class="einfo"><div class="ename">${e.name}</div><div class="edesc">${e.short}</div></div>
          <div class="epright">
            <div class="eprice" id="rec-price-disp">$${total} USD</div>
            <label class="spt"><input type="checkbox"${e.sp?' checked':''} onchange="togSP('rec',this.checked)"> ${t('showPrice')}</label>
          </div>
        </div>
        <div class="rec-opts${e.sel?' show':''}" id="rec-opts-panel">
          <div class="frow3" style="margin-bottom:0">
            <div class="fg" style="margin-bottom:0">
              <label>${t('recNights')}</label>
              <input type="number" id="rec-nights" min="1" max="30" value="${n}" style="width:100%" oninput="setRecNights(this.value)">
            </div>
            <div class="fg" style="margin-bottom:0;justify-content:flex-end">
              <label style="margin-bottom:8px">${t('recComp')}</label>
              <label class="rec-chk"><input type="checkbox" id="rec-comp"${comp?' checked':''} onchange="setRecComp(this.checked)"> +$${e.priceComp} USD/noche</label>
            </div>
            <div class="fg" style="margin-bottom:0;justify-content:flex-end">
              <label>${t('recPriceLabel')}</label>
              <span class="rec-price-tag" id="rec-total-tag">$${total} USD</span>
            </div>
          </div>
        </div>
      </div>`;
    }
    return `<div class="er-wrap"><div class="er">
      <input type="checkbox" id="ex_${e.id}"${e.sel?' checked':''} onchange="togEx('${e.id}',this.checked)">
      <div class="einfo"><div class="ename">${e.name}</div><div class="edesc">${e.short}</div></div>
      <div class="epright">
        <div class="eprice">${e.price}</div>
        <label class="spt"><input type="checkbox"${e.sp?' checked':''} onchange="togSP('${e.id}',this.checked)"> ${t('showPrice')}</label>
      </div>
    </div></div>`;
  }).join('');
}

function togEx(id,v){
  const e=extras.find(x=>x.id===id); if(!e)return; e.sel=v;
  if(id==='rec'){
    const panel=document.getElementById('rec-opts-panel');
    if(panel)panel.classList.toggle('show',v);
  }
}
function togSP(id,v){extras.find(e=>e.id===id).sp=v;renderExtras();}

function setRecNights(v){
  const e=extras.find(x=>x.id==='rec'); if(!e)return;
  e.nights=Math.max(1,parseInt(v)||1);
  updateRecDisplay(e);
}
function setRecComp(v){
  const e=extras.find(x=>x.id==='rec'); if(!e)return;
  e.companion=v;
  updateRecDisplay(e);
}
function updateRecDisplay(e){
  const n=e.nights||1, comp=e.companion||false;
  const total=n*200+(comp?n*60:0);
  const d1=document.getElementById('rec-price-disp');
  const d2=document.getElementById('rec-total-tag');
  if(d1)d1.textContent=`$${total} USD`;
  if(d2)d2.textContent=`$${total} USD`;
}

function calc(){
  let t2=0;
  ops.forEach(o=>{
    if(o.type==='promo'){const p=promos.find(x=>x.id===o.pid);if(p)t2+=p.promo;}
    else{const r=parseFloat(o.real)||0,d=parseFloat(o.disc)||0;t2+=r*(1-d/100);}
  });
  document.getElementById('tdisplay').textContent=`$${t2.toLocaleString('es-MX',{maximumFractionDigits:0})} USD`;
}

async function savePromo(idx){
  const np={id:idx!==null?promos[idx].id:'p'+Date.now(),
    name:document.getElementById('pf_n').value,
    sub:{es:document.getElementById('pf_ses').value,en:document.getElementById('pf_sen').value},
    before:+document.getElementById('pf_b').value||0,promo:+document.getElementById('pf_p').value||0,
    valid:document.getElementById('pf_v').value,
    inc:{es:document.getElementById('pf_ies').value.split('\n').filter(l=>l.trim()),
         en:document.getElementById('pf_ien').value.split('\n').filter(l=>l.trim())},
    bonos:{es:document.getElementById('pf_bes').value.split('\n').filter(l=>l.trim()),
           en:document.getElementById('pf_ben').value.split('\n').filter(l=>l.trim())},
    notes:{es:document.getElementById('pf_nes').value,en:document.getElementById('pf_nen').value},
    pkg:document.getElementById('pf_pkg').checked};
  if(idx!==null)promos[idx]=np; else promos.push(np);
  try{await window.storage.set('cp_promos',JSON.stringify(promos));}catch(e){}
  document.getElementById('pform').innerHTML='';
  renderPromos(); ops.forEach(o=>renderOp(o)); showToast(t('toastSaved'));
}
async function delPromo(i){
  if(!confirm(lang==='es'?'¿Eliminar esta promoción?':'Delete this promotion?'))return;
  promos.splice(i,1);
  try{await window.storage.set('cp_promos',JSON.stringify(promos));}catch(e){}
  renderPromos();
}
function showToast(m,bg='#065f46'){const el=document.getElementById('toast');el.textContent=m;el.style.background=bg;el.style.display='block';setTimeout(()=>el.style.display='none',3000);}

function toBase64UTF8(str){
  const bytes=new TextEncoder().encode(str);
  let bin='';for(const b of bytes)bin+=String.fromCharCode(b);
  return btoa(bin);
}

function extractDocUrl(data){
  for(const item of(data.content||[])){
    if(item.type==='mcp_tool_result'){
      const txt=item.content?.[0]?.text||'';
      try{const j=JSON.parse(txt);if(j.webViewLink)return j.webViewLink;if(j.id)return`https://docs.google.com/document/d/${j.id}/edit`;}catch(e){}
      const m=txt.match(/https:\/\/docs\.google\.com\/[^\s"'<>]+/);if(m)return m[0];
    }
  }
  const allText=(data.content||[]).filter(i=>i.type==='text').map(i=>i.text).join('\n');
  const m=allText.match(/https:\/\/docs\.google\.com\/[^\s"'<>]+/);
  return m?m[0]:null;
}

async function createGDoc(){
  const pn=document.getElementById('pname').value.trim();
  if(!pn){alert(t('errNoName'));return;}
  const btn=document.getElementById('btn-create');
  const box=document.getElementById('infoBox');
  btn.disabled=true; btn.textContent=t('btnCreating');
  box.style.display='block'; box.style.background='#e8f4fd'; box.style.borderColor='#90cdf4';
  box.innerHTML='🔄 '+(lang==='es'?'Conectando con Google Drive...':'Connecting to Google Drive...');
  try{
    const pd=document.getElementById('pdate').value;
    const title=`Cotización CIPlastic — ${pn} — ${pd}`;
    const b64=toBase64UTF8(buildDocHTML(pn,pd));
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',max_tokens:1000,
        system:'You are a Google Drive file creator. Immediately call create_file with the provided parameters. Return only the webViewLink URL.',
        messages:[{role:'user',content:`Call create_file: title="${title}", mimeType="text/html", content="${b64}". Return only the webViewLink.`}],
        mcp_servers:[{type:'url',url:'https://drivemcp.googleapis.com/mcp/v1',name:'gdrive'}]
      })
    });
    if(!res.ok){const e=await res.text();throw new Error(`HTTP ${res.status}: ${e.substring(0,300)}`);}
    const data=await res.json();
    if(data.error)throw new Error(JSON.stringify(data.error));
    const url=extractDocUrl(data);
    if(url){
      box.style.background='#e6f7e6';box.style.borderColor='#68d391';
      box.innerHTML=`<b style="color:#276749">✅ ${lang==='es'?'¡Documento creado!':'Document created!'}</b><br><a href="${url}" target="_blank" style="color:#1a3a6b;font-weight:700">📄 ${lang==='es'?'Abrir en Google Docs →':'Open in Google Docs →'}</a>`;
    } else {
      // Show raw response for debugging
      const dbg=JSON.stringify(data).substring(0,600);
      throw new Error('No URL found in response: '+dbg);
    }
  }catch(err){
    box.style.background='#fff0f0';box.style.borderColor='#fc8181';
    box.innerHTML=`<b style="color:#c53030">❌ Error:</b><br><small style="word-break:break-all">${err.message}</small>`;
    console.error('GDoc error:',err);
  }finally{
    btn.disabled=false;btn.textContent=t('btnCreate');
  }
}

init();
</script>
