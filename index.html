.wrap{max-width:900px;margin:0 auto;padding:16px}
.bar{background:linear-gradient(135deg,var(--nv),#2a4d9a);color:#fff;padding:12px 18px;border-radius:10px;margin-bottom:14px;display:flex;align-items:center;gap:14px;box-shadow:0 4px 18px rgba(26,58,107,.25)}

.lsw{margin-left:auto;display:flex;gap:5px}

.lb.on{background:rgba(255,255,255,.2);color:#fff;border-color:#fff}

.tab{flex:1;padding:10px;text-align:center;cursor:pointer;font-size:11px;font-weight:700;color:var(--lt);border-bottom:3px solid transparent;transition:all .2s}
.tab.on{color:var(--nv);border-bottom-color:var(--tl)}
.card{background:#fff;border-radius:10px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.ct{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--tl);margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid var(--bd)}
.fg{display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
.fg label{font-size:10px;font-weight:700;color:var(--lt);text-transform:uppercase;letter-spacing:.5px}
.fg input,.fg select,.fg textarea{border:1.5px solid var(--bd);border-radius:6px;padding:7px 10px;font-size:12px;color:var(--tx);font-family:inherit;transition:border-color .2s;width:100%}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--tl);box-shadow:0 0 0 3px rgba(43,191,212,.1)}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.r3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.oc{border:1.5px solid var(--bd);border-radius:8px;padding:13px;margin-bottom:10px}
.bdg{background:linear-gradient(135deg,var(--nv),#2a4d9a);color:#fff;border-radius:8px;padding:11px;margin-top:6px}
.bp{background:rgba(43,191,212,.25);color:#7dd8e8;border-radius:20px;padding:2px 8px;font-size:10px;display:inline-block;margin:2px 2px 0 0}
.tgl{display:flex;background:var(--gr);border-radius:6px;padding:2px;width:fit-content;margin-bottom:10px}
.tb{padding:5px 12px;border-radius:4px;border:none;cursor:pointer;font-size:11px;font-weight:700;background:transparent;color:var(--lt);transition:all .15s}
.tb.on{background:#fff;color:var(--nv);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.er{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.er:last-child{border-bottom:none}
.rp{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0}
.rb{background:var(--gr);border-radius:7px;padding:10px;margin:3px 0 5px 24px;display:none}
.rb.on{display:block}
.totb{background:linear-gradient(135deg,var(--nv),#2a4d9a);color:#fff;border-radius:10px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;margin:4px 0 10px}
.cbox{background:var(--gr);border-radius:6px;padding:6px 10px;margin-top:5px;font-size:11px;color:var(--lt)}
.addb{width:100%;padding:10px;border:2px dashed var(--bd);border-radius:8px;background:transparent;color:var(--lt);cursor:pointer;font-size:11px;font-weight:700;transition:all .2s;margin-bottom:10px}
.addb:hover{border-color:var(--tl);color:var(--tl)}
.pm{border:1.5px solid var(--bd);border-radius:8px;padding:12px;margin-bottom:9px}
.tag{background:var(--nv);color:#fff;border-radius:10px;padding:1px 7px;font-size:9px;font-weight:700;margin-left:5px;vertical-align:middle}
.bpdf{width:100%;padding:13px;background:var(--tl);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;margin-bottom:8px;transition:all .15s}

.bnv:hover{background:#12294d}
.bsm{border:1.5px solid var(--bd);background:transparent;padding:3px 8px;border-radius:5px;cursor:pointer;font-size:10px;color:var(--tx)}
.bdel{background:#fff0f0;color:#c53030;border:1px solid #fecaca;padding:3px 8px;border-radius:5px;cursor:pointer;font-size:10px}
input[type=checkbox]{accent-color:var(--nv);width:15px;height:15px;cursor:pointer;flex-shrink:0}

/* ===== PRINT ===== */
@media print{

.pbody{flex:1}
.pyhl{background:#fff8d0;padding:1px 5px;font-weight:bold;font-size:11pt}
.pibox{border-left:3px solid #1a3a6b;background:#f8f9fa;padding:8px 12px;margin:12px 0;font-size:9pt}
.pzti{color:#1a3a6b;font-weight:bold;font-style:italic;text-decoration:underline;font-size:9.5pt;margin:13px 0 5px}
.pftr{position:relative;height:88px;margin-top:auto}

.pte{color:#fff;font-family:Georgia,serif;font-style:italic;font-size:14pt;line-height:1.2}

    <span style="background:var(--nv);color:#fff;font-size:10px;font-weight:800;padding:2px 9px;border-radius:4px">${t('opt')} ${idx}</span>
    ${ops.length>1?`<button class="bdel" onclick="rmOp(${op.id})">${t('rm')}</button>`:''}
  </div>
  <div class="tgl">
    <button class="tb${op.type==='promo'?' on':''}" onclick="sT(${op.id},'promo')">🏷️ ${t('pr')}</button>
    <button class="tb${op.type==='manual'?' on':''}" onclick="sT(${op.id},'manual')">✏️ ${t('mn')}</button>
  </div>
  ${op.type==='promo'?`<div class="fg"><label>${t('lsp')}</label><select onchange="sP(${op.id},this.value)">${opts}</select></div>
  ${sp?`<div class="bdg"><div style="font-size:13px;font-weight:700">${sp.name} <span style="font-size:10px;opacity:.7;font-weight:400">${sp.sub[L]}</span></div>
  <div style="display:flex;align-items:baseline;gap:9px;margin-top:7px"><span style="text-decoration:line-through;opacity:.45;font-size:11px">$${sp.before.toLocaleString()} USD</span><span style="font-size:19px;font-weight:700;color:#7dd8e8">$${sp.promo.toLocaleString()} USD</span></div>
  <div style="font-size:9px;opacity:.55;margin-top:2px">${t('dVal')}: ${sp.valid}</div>
  ${sp.bonos[L]?.length?`<div style="margin-top:5px">${sp.bonos[L].map(b=>`<span class="bp">✓ ${b}</span>`).join('')}</div>`:''}</div>`:''}`
  :`<div class="fg"><label>${t('lpc')}</label><input value="${op.name}" oninput="sF(${op.id},'name',this.value)"></div>
  <div class="r2">
    <div class="fg"><label>${t('lr')}</label><input type="number" value="${op.real}" placeholder="0" oninput="sF(${op.id},'real',this.value);rOp(ops.find(o=>o.id==${op.id}));calc()"></div>
    <div class="fg"><label>${t('ldc')}</label><input type="number" value="${op.disc}" placeholder="0" min="0" max="100" oninput="sF(${op.id},'disc',this.value);rOp(ops.find(o=>o.id==${op.id}));calc()"></div>
  </div>
  ${rp2>0?`<div class="cbox">${ds>0?`<s style="opacity:.5">$${rp2.toLocaleString()}</s> → `:''}<strong style="color:var(--nv)">$${Math.round(dp).toLocaleString()} USD</strong>${ds>0?` <span style="opacity:.6">(-${ds}%)</span>`:''}</div>`:''}
  <div class="fg" style="margin-top:7px"><label>${t('lpi')}</label><textarea rows="2" oninput="sF(${op.id},'desc',this.value)">${op.desc}</textarea></div>`}`;
  el?el.replaceWith(d):cont.appendChild(d);
}
function sT(id,tp){const o=ops.find(x=>x.id===id);if(o){o.type=tp;rOp(o);calc();}}
function sP(id,v){const o=ops.find(x=>x.id===id);if(o){o.pid=v;rOp(o);calc();}}
function sF(id,f,v){const o=ops.find(x=>x.id===id);if(o)o[f]=v;}

function rEX(){
  $('ec').innerHTML=EX.map(e=>{
    if(e.id==='rec'){
      const n=e.nights||1,c=e.companion||false,tot=n*200+(c?n*60:0);
      return`<div><div class="er"><input type="checkbox"${e.sel?' checked':''} onchange="tEx('rec',this.checked)" style="margin-top:2px">
      <div style="flex:1"><div style="font-size:12px;font-weight:700">${e.n}</div><div style="font-size:10px;color:var(--lt);margin-top:1px">${e.sh}</div></div>
      <div class="rp"><div id="rpdsp" style="font-size:11px;font-weight:700;color:var(--tl)">$${tot} USD</div>
      <label style="display:flex;align-items:center;gap:3px;font-size:10px;color:var(--lt);cursor:pointer"><input type="checkbox"${e.sp?' checked':''} onchange="tSP('rec',this.checked)"> ${t('shp')}</label></div></div>
      <div class="rb${e.sel?' on':''}" id="recbox">
        <div class="r3" style="gap:8px">
          <div class="fg" style="margin-bottom:0"><label>${t('rn')}</label><input type="number" min="1" max="30" value="${n}" oninput="sRN(this.value)"></div>
          <div class="fg" style="margin-bottom:0"><label>${t('rc')} <span style="color:var(--lt);font-weight:400">(+$60/noche)</span></label>
            <label style="display:flex;align-items:center;gap:5px;font-size:12px;margin-top:5px"><input type="checkbox"${c?' checked':''} onchange="sRC(this.checked)"> +$${e.pc} USD/noche</label></div>
          <div class="fg" style="margin-bottom:0"><label>${t('rpl')}</label><div id="rtot" style="font-weight:700;color:var(--nv);margin-top:5px;font-size:14px">$${tot} USD</div></div>
        </div>
      </div></div>`;
    }
    return`<div class="er"><input type="checkbox"${e.sel?' checked':''} onchange="tEx('${e.id}',this.checked)" style="margin-top:2px">
    <div style="flex:1"><div style="font-size:12px;font-weight:700">${e.n}</div><div style="font-size:10px;color:var(--lt);margin-top:1px">${e.sh}</div></div>
    <div class="rp"><div style="font-size:11px;font-weight:700;color:var(--tl)">${e.pr}</div>
    <label style="display:flex;align-items:center;gap:3px;font-size:10px;color:var(--lt);cursor:pointer"><input type="checkbox"${e.sp?' checked':''} onchange="tSP('${e.id}',this.checked)"> ${t('shp')}</label></div></div>`;
  }).join('');
}
function tEx(id,v){const e=EX.find(x=>x.id===id);if(!e)return;e.sel=v;if(id==='rec'){const b=$('recbox');if(b)b.classList.toggle('on',v);}}
function tSP(id,v){EX.find(e=>e.id===id).sp=v;rEX();}
function sRN(v){const e=EX.find(x=>x.id==='rec');if(!e)return;e.nights=Math.max(1,parseInt(v)||1);uRD(e);}
function sRC(v){const e=EX.find(x=>x.id==='rec');if(!e)return;e.companion=v;uRD(e);}
function uRD(e){const n=e.nights||1,c=e.companion||false,tot=n*200+(c?n*60:0);['rpdsp','rtot'].forEach(id=>{const el=$(id);if(el)el.textContent=`$${tot} USD`;});}
function calc(){let t2=0;ops.forEach(o=>{if(o.type==='promo'){const p=PR.find(x=>x.id===o.pid);if(p)t2+=p.promo;}else{const r=parseFloat(o.real)||0,d=parseFloat(o.disc)||0;t2+=r*(1-d/100);}});$('td').textContent=`$${Math.round(t2).toLocaleString()} USD`;}

function rPR(){
  const c=$('pl');if(!c)return;
  c.innerHTML=PR.map((p,i)=>`<div class="pm"><div style="display:flex;justify-content:space-between;align-items:flex-start">
    <div><div style="font-weight:700;font-size:13px">${p.name}<span class="tag">${p.valid?.includes('31')?'Glow Fwd':'Mommy Stunne'}</span></div>
    <div style="font-size:11px;color:var(--lt);margin-top:2px">${p.sub[L]} · ${p.valid}</div>
    <div style="margin-top:4px"><span style="text-decoration:line-through;color:var(--lt);font-size:11px">$${p.before.toLocaleString()}</span><strong style="color:var(--nv);margin-left:8px">$${p.promo.toLocaleString()} USD</strong></div></div>
    <div style="display:flex;gap:5px"><button class="bsm" onclick="openPF(${i})">${t('ed')}</button><button class="bdel" onclick="dPR(${i})">${t('dl')}</button></div>
  </div></div>`).join('');
}
function openPF(idx=null){
  const p=idx!=null?PR[idx]:{id:'p'+Date.now(),name:'',sub:{es:'',en:''},before:0,promo:0,valid:'',inc:{es:[],en:[]},notes:{es:'',en:''},bonos:{es:[],en:[]},pkg:false};
  $('pf').innerHTML=`<div class="card" style="border:2px solid var(--tl)"><div class="ct">${idx!=null?t('ed'):t('bnp')}</div>
  <div class="r2"><div class="fg"><label>Nombre / Name</label><input id="fn" value="${p.name}"></div><div class="fg"><label>Vigencia / Valid</label><input id="fv" value="${p.valid}"></div></div>
  <div class="r2"><div class="fg"><label>Subtítulo ES</label><input id="fses" value="${p.sub.es}"></div><div class="fg"><label>Subtitle EN</label><input id="fsen" value="${p.sub.en}"></div></div>
  <div class="r2"><div class="fg"><label>Precio Antes (USD)</label><input type="number" id="fb" value="${p.before}"></div><div class="fg"><label>Precio Promo (USD)</label><input type="number" id="fp" value="${p.promo}"></div></div>
  <div class="r2"><div class="fg"><label>Procedimientos ES (uno por línea)</label><textarea id="fies" rows="3">${(p.inc.es||[]).join('\n')}</textarea></div><div class="fg"><label>Procedures EN (one per line)</label><textarea id="fien" rows="3">${(p.inc.en||[]).join('\n')}</textarea></div></div>
  <div class="r2"><div class="fg"><label>Bonos ES</label><textarea id="fbes" rows="2">${(p.bonos.es||[]).join('\n')}</textarea></div><div class="fg"><label>Bonuses EN</label><textarea id="fben" rows="2">${(p.bonos.en||[]).join('\n')}</textarea></div></div>
  <div class="r2"><div class="fg"><label>Notas ES</label><textarea id="fnes" rows="2">${p.notes.es||''}</textarea></div><div class="fg"><label>Notes EN</label><textarea id="fnen" rows="2">${p.notes.en||''}</textarea></div></div>

  <div style="display:flex;gap:7px">
    <button onclick="svPR(${idx})" style="background:var(--nv);color:#fff;border:none;padding:8px 16px;border-radius:7px;cursor:pointer;font-size:12px;font-weight:700">${t('sv')}</button>
    <button onclick="$('pf').innerHTML=''" style="border:1.5px solid var(--bd);background:transparent;padding:8px 16px;border-radius:7px;cursor:pointer;font-size:12px">${t('ca')}</button>
  </div></div>`;
  $('pf').scrollIntoView({behavior:'smooth'});
}
function svPR(idx){
  const np={id:idx!=null?PR[idx].id:'p'+Date.now(),name:$('fn').value,sub:{es:$('fses').value,en:$('fsen').value},before:+$('fb').value||0,promo:+$('fp').value||0,valid:$('fv').value,inc:{es:$('fies').value.split('\n').filter(l=>l.trim()),en:$('fien').value.split('\n').filter(l=>l.trim())},bonos:{es:$('fbes').value.split('\n').filter(l=>l.trim()),en:$('fben').value.split('\n').filter(l=>l.trim())},notes:{es:$('fnes').value,en:$('fnen').value},pkg:$('fpkg').checked};
  if(idx!=null)PR[idx]=np;else PR.push(np);
  savePromos();$('pf').innerHTML='';rPR();ops.forEach(o=>rOp(o));
}
function dPR(i){if(!confirm(L==='es'?'¿Eliminar esta promoción?':'Delete this promotion?'))return;PR.splice(i,1);savePromos();rPR();}

function genPDF(){
  const pn=$('pn').value.trim();
  if(!pn){alert(t('noname')||'Por favor ingrese el nombre del paciente.');return;}
  const pd=$('pd').value;
  const notes=$('notes').value.trim();
  const tx=TX[L];
  const dfmt=pd?new Date(pd+'T12:00:00').toLocaleDateString(L==='es'?'es-MX':'en-US',{day:'2-digit',month:'2-digit',year:'numeric'}):'';
  let total=0;

  /* Build ops HTML */
  let opsH='';
  ops.forEach((op,i)=>{
    let nm,bef,prmo,inc=[],bonos=[],nt='',hasPkg=false;

      const p=PR.find(x=>x.id===op.pid);if(!p)return;
      nm=`${p.name}<span style="color:#2bbfd4;font-size:9pt;font-weight:400"> — ${p.sub[L]}</span>`;
      bef=p.before;prmo=p.promo;inc=p.inc[L]||[];bonos=p.bonos[L]||[];nt=p.notes[L]||'';hasPkg=p.pkg;total+=prmo;
    } else {
      const r=parseFloat(op.real)||0,d=parseFloat(op.disc)||0,dp=Math.round(r*(1-d/100));
      nm=op.name||tx.lpc;bef=r;prmo=dp;if(op.desc)inc=op.desc.split('\n').filter(x=>x.trim());total+=prmo;
    }
    opsH+=`<div style="margin-bottom:14px;padding-bottom:13px;${i<ops.length-1?'border-bottom:.5px solid #e2e8f0':''}">
    <p style="font-size:8.5pt;font-weight:700;text-decoration:underline;color:#1a3a6b;margin-bottom:6px">${tx.dOpt} ${i+1}</p>
    <table style="width:100%;border-collapse:collapse"><tr>
      <td style="font-size:10.5pt;font-weight:700">${tx.dProc} ${i+1}: ${nm}</td>
      ${bef>prmo?`<td style="text-align:right;color:#888;text-decoration:line-through;font-size:9pt;white-space:nowrap">$${bef.toLocaleString()} USD</td>`:'<td></td>'}
    </tr></table>
    ${bef>prmo?`<p style="font-size:9.5pt;margin-top:5px">${tx.dPrm}: &nbsp;<span class="pyhl">$${prmo.toLocaleString('es-MX',{maximumFractionDigits:0})} USD</span></p>`:`<p style="font-size:11pt;font-weight:700;color:#1a3a6b;margin-top:4px">$${prmo.toLocaleString('es-MX',{maximumFractionDigits:0})} USD</p>`}
    ${inc.length?`<p style="font-style:italic;font-size:8.5pt;color:#333;margin:9px 0 3px">${tx.dPQ}</p>${inc.map(x=>`<p style="color:#2bbfd4;font-weight:700;font-style:italic;padding-left:10px;font-size:9pt;margin-bottom:2px">• ${x}</p>`).join('')}`:''}
    ${bonos.length?`<p style="font-size:9pt;margin-top:5px"><strong>${tx.dInc}:</strong> ${bonos.join(', ')}</p>`:''}
    ${nt?`<p style="font-size:8pt;margin-top:5px"><strong>Nota:</strong> ${nt}</p>`:''}
    ${hasPkg?`<div style="border:1px solid #e2e8f0;border-radius:4px;padding:9px 12px;margin-top:10px">
      <p style="font-size:8pt;font-weight:700;text-decoration:underline;margin-bottom:6px">${tx.dPT}</p>
      <table style="width:100%;border-collapse:collapse;font-size:7.5pt;font-style:italic">
        <tr>${tx.PKG.slice(0,3).map(x=>`<td style="padding:2px 4px">- ${x}</td>`).join('')}</tr>
        <tr>${tx.PKG.slice(3).map(x=>`<td style="padding:2px 4px">- ${x}</td>`).join('')}</tr>
      </table></div>`:''}
    </div>`;

  const notesH=notes?`<div style="border-left:3px solid #2bbfd4;background:#f8f9fa;padding:7px 11px;margin-bottom:12px;font-size:9pt;color:#555;font-style:italic"><strong>Nota:</strong> ${notes}</div>`:'';

  const p1=`<table style="width:100%;border-collapse:collapse;margin-bottom:16px"><tr>
    <td><p style="font-size:14pt;font-weight:700;color:#1a3a6b;font-style:italic">${tx.dPat}: <span style="text-transform:uppercase">${pn}</span></p></td>
    <td style="text-align:right"><p style="font-size:11.5pt;font-weight:700;color:#1a3a6b">${tx.dDate}: ${dfmt}</p></td></tr></table>
  <div style="margin-bottom:6px">${opsH}</div>
  ${notesH}
  <table style="width:100%;border-collapse:collapse;border-top:2px solid #1a3a6b;padding-top:8px;margin:10px 0 12px"><tr>
    <td><span style="font-size:10.5pt;font-weight:700;color:#2bbfd4">${tx.dTot}:</span></td>
    <td style="text-align:right"><span style="font-size:22pt;font-weight:700;color:#1a3a6b">$&nbsp;${Math.round(total).toLocaleString('es-MX',{maximumFractionDigits:0})} USD</span></td></tr></table>
  <div class="pibox"><strong>${tx.dI}:</strong> ${tx.dIT}</div>
  <p style="font-size:11.5pt;font-weight:700;font-style:italic;color:#1a3a6b;text-align:center;margin:12px 0 7px">${tx.dST}</p>
  ${tx.SURG.map(x=>`<p style="padding-left:16px;font-size:9pt;margin-bottom:2px">&#8226; ${x}</p>`).join('')}
  <div class="pzti">${tx.dZT}</div>
  <p style="font-style:italic;font-size:9pt;line-height:2">
    <strong>${tx.ZL[0]}:</strong> ZELLE<br>
    <strong>${tx.ZL[1]}:</strong> Ciplastic America<br>
    <strong>${tx.ZL[2]}:</strong> 5596143241<br>
    <strong>${tx.ZL[3]}:</strong> hospital@ciplastic.com<br>
    <strong>${tx.ZL[4]}:</strong> $250 USD</p>`;

  const selEx=EX.filter(e=>e.sel);
  const p2=selEx.length?`<h2 style="color:#1a3a6b;font-size:13pt;margin-bottom:5px">${tx.dET}</h2>
  <p style="font-size:8pt;color:#666;font-style:italic;margin-bottom:18px">${tx.dES}</p>
  ${selEx.map(e=>`<div style="margin-bottom:15px"><p style="color:#2bbfd4;font-weight:700;font-style:italic;font-size:9.5pt">${e.n}${e.sp?(': '+(e.id==='rec'?rPrc(e):e.pr)):''}</p><p style="font-size:8.5pt;color:#444;padding-left:8px;margin-top:5px;line-height:1.6">${e.fu}</p></div>`).join('')}`:'';

  const p3=`<h3 style="color:#1a3a6b;font-size:12pt;margin-bottom:8px">${tx.dCT}</h3>
  <p style="font-size:9pt;color:#555;margin-bottom:16px">${tx.dCC}</p>
  <p style="font-weight:700;font-size:9.5pt;margin-top:10px">Tel:</p>
  <p style="padding-left:16px;font-size:9.5pt">&#8226; MEX (664) 383 8390</p>
  <p style="padding-left:16px;font-size:9.5pt">&#8226; USA +52 (664) 383 6664 / +1 (619) 798 9836</p>
  <p style="font-weight:700;font-size:9.5pt;margin-top:10px">Email:</p>
  <p style="padding-left:16px;font-size:9.5pt">&#8226; hospital@ciplastic.com</p>
  <p style="font-weight:700;font-size:9.5pt;margin-top:10px">URL:</p>
  <p style="padding-left:16px;font-size:9.5pt">&#8226; www.ciplastic.com</p>
  <p style="font-weight:700;font-size:9.5pt;margin-top:10px">Instagram:</p>
  <p style="padding-left:16px;font-size:9.5pt">&#8226; @ciplastic_hermespelayo &nbsp; &#8226; @hermespelayomd</p>
  <p style="font-weight:700;font-size:9.5pt;margin-top:10px">Facebook:</p>
  <p style="padding-left:16px;font-size:9.5pt">&#8226; Ciplastic Plastic Surgery and Med Spa</p>
  <p style="text-align:center;font-weight:700;color:#1a3a6b;margin-top:36px;font-size:10.5pt">${tx.dTk.replace('\n','<br>')}</p>`;

  /* Render to print area then print */
  $('printArea').innerHTML=buildPage(p1)+(p2?buildPage(p2):'')+buildPage(p3);
  setTimeout(()=>window.print(),400);
}

init();
</script>
